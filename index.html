<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTF is Backpacking? | Real Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark: #0b282c;
            --brand-teal: #104f55;
            --brand-accent: #92ccd1;
            --brand-white: #e7f6f7;
        }
        body, html {
            height: 100%; margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--brand-dark);
            color: var(--brand-white);
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--brand-teal) 0%, var(--brand-dark) 100%);
            z-index: -1;
        }
        .container { z-index: 1; padding: 20px; max-width: 450px; }
        
        .logo {
            max-width: 320px; width: 100%; height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }
        h1 { font-family: 'Oswald', sans-serif; font-size: 3rem; margin: 0; letter-spacing: 2px; }
        .tagline { 
            text-transform: uppercase; letter-spacing: 3px; font-weight: 700; 
            color: var(--brand-accent); margin: 15px 0; font-size: 0.85rem;
        }
        .btn-group { margin-top: 35px; display: flex; gap: 10px; justify-content: center; }
        .btn {
            border: 2px solid var(--brand-accent);
            padding: 10px 20px; border-radius: 50px;
            color: white; text-decoration: none; font-weight: 700;
            font-size: 0.8rem; transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }
        .btn:hover { background: var(--brand-accent); color: var(--brand-dark); }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <img src="logo.jpeg" alt="WTF is Backpacking" class="logo">
        
        <h1>COMING SOON</h1>
        <p class="tagline">DROP #1 . KERALAM . 12 DAYS DIY</p>
        
        <div class="btn-group">
            <a href="https://wtfisbackpacking.com" class="btn">wtfisbackpacking.com</a>
            <a href="https://instagram.com/wtfisbackpacking" class="btn">@wtfisbackpacking</a>
        </div>
    </div>
</body>
</html>
